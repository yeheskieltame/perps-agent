[project]
name = "perpsbot"
version = "0.0.1"
description = "Perps Agent Telegram bot — product UI over the worker/gateway HTTP API (never imports the engine or any SDK)."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "aiohttp>=3.9",
    "pydantic-settings>=2",
    "Pillow>=10",          # render the PnL share-card image on position close
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpsbot"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
