[project]
name = "perpsagent"
version = "0.0.1"
description = "Perps Agent — a verifiable, self-improving grid-trading agent. Executes on Bybit; thinks, learns, and proves on Mantle."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "aiohttp>=3.9",
    "web3>=6",
    "eth-account>=0.11",
]

[project.optional-dependencies]
bybit = ["pybit>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perpsagent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
