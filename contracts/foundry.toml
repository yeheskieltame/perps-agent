[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Required by openzeppelin-foundry-upgrades for upgrade-safety validations.
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "out" }]

[rpc_endpoints]
mantle_testnet = "${MANTLE_TESTNET_RPC}"
mantle = "${MANTLE_RPC}"

[etherscan]
mantle_testnet = { key = "${MANTLESCAN_API_KEY}", url = "https://api-sepolia.mantlescan.xyz/api" }
mantle = { key = "${MANTLESCAN_API_KEY}", url = "https://api.mantlescan.xyz/api" }
